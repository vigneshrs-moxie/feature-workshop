<!doctype html>
<html lang="en" data-theme="default">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ground Control · classic view</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- The new view's theme (tokens and page backgrounds, built by npm run web:build), then this page's own styles. -->
  <link rel="stylesheet" href="/next/theme.css">
  <link rel="stylesheet" href="styles.css">
  <script src="theme-boot.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="title" href="#/" aria-label="Ground Control, back to the map">
      <span id="foreman"></span>
      <span class="title-words"><h1 id="title-text">Ground Control</h1><small>Your crew, your features, your turn</small></span>
    </a>
    <nav class="top-right" aria-label="Workshop controls">
      <button class="btn new-job" id="new-job" type="button">New job</button>
      <a class="top-link" href="#/history" title="Turn a past Claude Code conversation into a job">History</a>
      <a class="top-link" href="#/costs" title="What your jobs have cost, with exports">Costs</a>
      <a class="top-link" href="#/crew" title="Meet the crew">Crew-dex</a>
      <a class="needs-badge" id="needs-badge" href="#/" data-count="0">
        <span class="num" id="needs-num">0</span><span id="needs-label">need you</span>
      </a>
      <button class="icon-btn" id="alerts" type="button" aria-label="Alerts">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.6 1.8H4.4z" fill="currentColor"/><circle cx="12" cy="20.3" r="2" fill="currentColor"/></svg>
      </button>
      <a class="top-link" href="/next/#/settings" title="Permissions, notifications, look, keys, workflow, Play and rules: the new view’s Settings, in sections. The theme and text size you pick there are used here too.">Settings</a>
      <a class="top-link to-new" id="to-new" href="/next/" title="Back to the new view, on the same page (key: n)">New view</a>
    </nav>
  </header>

  <div id="usage" class="usage-slot"></div>
  <main id="app" tabindex="-1">
    <p class="empty">Opening the workshop…</p>
  </main>
</body>
</html>
